name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gojgp
        run: go install github.com/gosuda/JustGoodPractices/cmd/gojgp@v1.2.0
      - name: Run all tests
        run: go test -count=1 ./...
      - name: Run go vet
        run: go vet ./...
      - name: Run gojgp
        run: gojgp lint ./...
