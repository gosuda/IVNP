name: Register commit in Go checksum database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-commit:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    env:
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Fetch module at commit SHA
        shell: bash
        run: |
          set -euo pipefail
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT
          cd "$temp_dir"
          go mod init sumdb-registration
          go get "gosuda.org/ivnp@${GITHUB_SHA}"
