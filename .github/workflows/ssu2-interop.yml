name: SSU2 pinned-router interop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssu2-interop:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Bootstrap NetDB and acquire pinned RouterInfo
        shell: bash
        run: |
          set -euo pipefail
          IVNP_STABLE_ROUTERINFO_ACQUIRE=1 \
          IVNP_STABLE_ROUTER_INFO_OUTPUT="$RUNNER_TEMP/stable-router.info" \
            go test -tags integration ./controlplane/internal/runtime \
              -run '^TestAcquireStableRouterInfo$' -count=1 -timeout=3m -v
      - name: Run exact-hash SSU2 round trip
        shell: bash
        run: |
          set -euo pipefail
          IVNP_STABLE_SSU2_INTEGRATION=1 \
          IVNP_STABLE_SSU2_ROUTER_INFO="$RUNNER_TEMP/stable-router.info" \
            go test -tags integration ./dataplane/internal/router \
              -run '^TestStableRouterSSU2Interop$' -count=1 -timeout=90s -v
