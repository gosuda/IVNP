name: In-memory daemon eepsite access

on:
  workflow_dispatch:
  schedule:
    # Run weekly as healthcheck
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  in-memory-eepsite:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Fetch i2p-projekt.i2p through the in-memory daemon proxy
        shell: bash
        run: |
          set -euo pipefail
          IVNP_LIVE_MEMORY_EEPSITE=1 \
            go test -tags integration -v -timeout=20m \
              -run '^TestInMemoryDaemonFetchesPublicEepsite$' ./tests/integration
