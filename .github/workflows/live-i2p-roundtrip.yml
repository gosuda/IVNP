name: Live I2P round trip

on:
  workflow_dispatch:
  schedule:
    # Run weekly as healthcheck
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  live-i2p-roundtrip:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Run live I2P streaming, HTTP, and datagram round-trip
        shell: bash
        run: |
          set -euo pipefail
          IVNP_LIVE_ROUNDTRIP=1 \
            go test -tags integration -v -timeout=18m \
              -run '^TestLiveI2PRoundTrip$' ./tests/integration
