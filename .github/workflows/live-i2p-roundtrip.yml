name: Live I2P round trip

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-i2p-roundtrip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-i2p-roundtrip:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run live I2P streaming, HTTP, and datagram round-trip
        shell: bash
        run: |
          set -euo pipefail
          IVNP_LIVE_ROUNDTRIP=1 \
            go test -tags integration -v -timeout=18m \
              -run '^TestLiveI2PRoundTrip$' ./tests/integration
