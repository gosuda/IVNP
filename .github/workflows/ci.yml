name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      macos:
        description: Run native macOS arm64 verification
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, vet, lint
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Go tool binaries
        id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/gojgp
            ~/go/bin/goimports
            ~/go/bin/checklocks
          key: gotools-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-gojgp-v1.2.0-tools-v0.51.0-checklocks-20261024223036-c3e0783a533c
      - name: Install gojgp and goimports
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          cd "$tmp"
          GOTOOLCHAIN=local go mod init tools
          GOTOOLCHAIN=local go get github.com/gosuda/JustGoodPractices/cmd/gojgp@v1.2.0 golang.org/x/tools/cmd/goimports@v0.51.0
          GOTOOLCHAIN=local go install github.com/gosuda/JustGoodPractices/cmd/gojgp golang.org/x/tools/cmd/goimports
      - name: Install checklocks
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: GOTOOLCHAIN=local go install gvisor.dev/gvisor/tools/checklocks/cmd/checklocks@v0.0.0-20261024223036-c3e0783a533c
      - name: Check canonical imports
        run: go run ./tools/importformatter
      - name: Run go vet
        run: go vet ./...
      - name: Run checklocks
        run: go vet -vettool="$(go env GOPATH)/bin/checklocks" -inferred=false ./...
      - name: Run gojgp
        run: gojgp lint ./...
      - name: Run all tests
        run: go test -count=1 ./...
      - name: Cross-compile targets and integration tests
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./...
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o /dev/null ./dataplane/internal/transport/ssu2
          go test -tags integration -run '^$' ./...

  dst:
    name: DST (10 seeds)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    env:
      # go test surfaces captured stderr only on failure, so per-node debug
      # logs are free on pass and present when a rare flake finally trips.
      DST_LOG: '1'
      # Serialize scheduling inside the synctest bubble: one P runs goroutines
      # in runqueue order, async preemption stays off, and crypto packages
      # honor the pinned crypto/rand.Reader, so same-tick wakeups replay in
      # program order instead of racing across threads.
      GOMAXPROCS: '1'
      GODEBUG: 'asyncpreemptoff=1,cryptocustomrand=1'
      # Keep GC marker goroutines out of the single P's run queue so
      # executions replay identically (the dst overlay pins runtime
      # randomness and neutralizes sysmon P retakes).
      GOGC: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate durable-sync overlay
        # Patches the current GOROOT's sync primitives so lock waits inside a
        # synctest bubble park durably and the virtual clock can advance.
        run: go run ./tools/dstoverlay -write "$RUNNER_TEMP/dst_overlay.json" -dir "$RUNNER_TEMP/dst_overlay_src"
      - name: Run deterministic simulation across 10 seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 16 42 67 1982 1992 2002 2012 2022 2026; do
            echo "::group::DST seed $seed"
            DST_SEED="$seed" go test -count=1 -tags dst -overlay="$RUNNER_TEMP/dst_overlay.json" -run 'TestSim|TestDeterministic' .
            DST_SEED="$seed" go test -count=1 -tags dst -overlay="$RUNNER_TEMP/dst_overlay.json" ./internal/simnet ./dataplane/internal/streaming/tunnel ./dataplane/internal/router ./controlplane/internal/router
            echo "::endgroup::"
          done

  windows:
    name: Windows / amd64
    runs-on: depot-windows-2025
    timeout-minutes: 15
    env:
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build packages
        run: go build ./...
      - name: Run Windows state security regressions
        run: go test -count=1 ./state/internal/filesystem_store ./state/internal/secure_store ./state/internal/configuration -run 'Test(Windows|CreatePrivate|AtomicRoundTrip|ReadBoundedRejectsSymlink|StateLock|StateRejectsUnsafe|StateCiphertext|LoadOrCreatePersists|LoadOrCreateOperating|LoadOperatingRejects|LoadRejectsSwapped)'
      - name: Run portable transport tests
        run: go test -count=1 ./dataplane/internal/transport/ssu2

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    name: macOS / arm64 (manual)
    runs-on: depot-macos-latest
    timeout-minutes: 15
    env:
      GOARCH: arm64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build packages
        run: go build ./...
      - name: Run Unix state and portable transport tests
        run: go test -count=1 ./state/internal/filesystem_store ./state/internal/secure_store ./state/internal/configuration ./dataplane/internal/transport/ssu2
